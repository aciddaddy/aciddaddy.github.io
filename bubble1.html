<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="./contact.css">
</head>
<body class="contact-page">

    <header>
        <nav>
            <a href="./index.html" class="nav-button">Home</a>
            <a href="./bubble1.html" class="nav-button">Contact</a>
            <!-- Add your other nav buttons here to match the rest of the site -->
        </nav>
    </header>

    <h1>Contact Form</h1>

    <form action="https://formspree.io/f/mgaowdya" method="POST">
        <input type="text" name="first" placeholder="First Name" autocomplete="off" required>
        <input type="text" name="last" placeholder="Last Name" autocomplete="off" required>
        <input type="email" name="email" placeholder="Email Address" autocomplete="off" required>
        <textarea rows="5" cols="60" name="message" placeholder="Enter Text" autocomplete="off" required></textarea>
        <button type="submit">Send Message</button>
    </form>

</body>
</html>
